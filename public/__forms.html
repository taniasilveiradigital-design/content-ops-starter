<!doctype html>
<html lang="pt-PT">
<head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Formulários</title></head>
<body>
<!-- Declaração dos formulários para o Netlify Forms. Não apagar. -->
<form name="contacto" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input name="bot-field"><input name="nome"><input name="email"><input name="marca"><input name="link">
  <input name="fase"><input name="servico"><textarea name="mensagem"></textarea><input name="consentimento">
</form>
<form name="diagnostico" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input name="bot-field"><input name="nome"><input name="email"><input name="marca"><input name="fase">
  <input name="gargalo"><input name="servico_recomendado"><input name="pontuacoes"><input name="consentimento">
</form>
</body>
</html>
